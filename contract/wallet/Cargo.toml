[package]
name = "intented-wallet"
description = "The Intented wallet contract: executes an agent action only with a TEE-signed ALLOW verdict, within hard caps."
version = "0.0.0"
edition = "2021"
publish = false
repository = "https://github.com/furqaannabi/intented"

# Reproducible build (cargo-near's defaults): `cargo near build reproducible-wasm` builds in this
# pinned image, so anyone can rebuild the deployed wasm from the repo and compare its hash.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30", features = ["unstable"] }
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing", "unstable"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
